overrides:
  fast-xml-parser: '>=5.5.6'
  lodash: '>=4.18.0'
  minimatch: '>=9.0.7'
  multer: '>=2.1.1'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'

# pnpm 10.x blocks postinstall scripts by default. Allow the ones we
# trust and actually need — @sentry/cli ships a binary, esbuild and
# unrs-resolver need native bindings, @nestjs/core/@scarf/scarf only
# print info.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@sentry/cli'
  - esbuild
  - unrs-resolver
