image: python:3.11-alpine

definitions:
  services:
    docker:
      memory: 3072
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step:
              name: Lint + Type Check
              image: node:24-alpine
              caches:
                - pnpm
              script:
                - corepack enable && corepack prepare pnpm@latest --activate
                - pnpm config set store-dir .pnpm-store
                - pnpm install --frozen-lockfile
                - pnpm lint
                - pnpm tsc --noEmit

          - step:
              name: Unit Tests
              image: node:24-alpine
              caches:
                - pnpm
              script:
                - corepack enable && corepack prepare pnpm@latest --activate
                - pnpm config set store-dir .pnpm-store
                - pnpm install --frozen-lockfile
                - pnpm test

  branches:
    staging:
      - step:
          name: Build + Scan + Push (Staging)
          services:
            - docker
          caches:
            - docker
          script:
            - apk add --no-cache curl nodejs npm
            - pip install awscli
            - export IMAGE="082178185739.dkr.ecr.us-east-1.amazonaws.com/billing-service"
            - export TAG=${BITBUCKET_COMMIT:0:7}
            - export SENTRY_RELEASE=$TAG
            - export SENTRY_ENVIRONMENT=staging

            - aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
            - aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
            - aws configure set default.region "us-east-1"
            - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 082178185739.dkr.ecr.us-east-1.amazonaws.com

            - docker build --build-arg SENTRY_RELEASE=$SENTRY_RELEASE -t $IMAGE:$TAG -t $IMAGE:staging .

            # The Dockerfile build stage already injected debug IDs into dist.
            # Here we extract that exact dist and upload sourcemaps so the
            # debug IDs in the running image match what Sentry has.
            # SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are repo vars.
            - if [ -n "$SENTRY_AUTH_TOKEN" ]; then
                set -e;
                docker create --name billing-extract $IMAGE:$TAG;
                docker cp billing-extract:/app/dist ./dist;
                docker rm billing-extract;
                npx --yes @sentry/cli@2 sourcemaps upload --release="$SENTRY_RELEASE" --org="$SENTRY_ORG" --project="$SENTRY_PROJECT" ./dist;
              else
                echo "SENTRY_AUTH_TOKEN not set — skipping sourcemap upload";
              fi

            - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            - docker save $IMAGE:$TAG -o billing.tar
            - trivy image --input billing.tar --severity CRITICAL,HIGH --exit-code 0 --ignore-unfixed --no-progress
            - rm -f billing.tar

            - docker push $IMAGE:$TAG
            - docker push $IMAGE:staging

      - step:
          name: Deploy to Staging ECS
          script:
            - pip install awscli
            - aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
            - aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
            - aws configure set default.region "us-east-1"
            - aws ecs update-service --cluster billing-service-staging --service billing-service-staging-svc --force-new-deployment --region us-east-1

    main:
      - step:
          name: Build + Scan + Push (Production)
          services:
            - docker
          caches:
            - docker
          script:
            - apk add --no-cache curl nodejs npm
            - pip install awscli
            - export IMAGE="082178185739.dkr.ecr.us-east-1.amazonaws.com/billing-service"
            - export TAG=${BITBUCKET_COMMIT:0:7}
            - export SENTRY_RELEASE=$TAG
            - export SENTRY_ENVIRONMENT=production

            - aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
            - aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
            - aws configure set default.region "us-east-1"
            - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 082178185739.dkr.ecr.us-east-1.amazonaws.com

            - docker build --build-arg SENTRY_RELEASE=$SENTRY_RELEASE -t $IMAGE:$TAG -t $IMAGE:latest .

            # The Dockerfile build stage already injected debug IDs into dist.
            # Extract and upload so debug IDs in the image match Sentry.
            - if [ -n "$SENTRY_AUTH_TOKEN" ]; then
                set -e;
                docker create --name billing-extract $IMAGE:$TAG;
                docker cp billing-extract:/app/dist ./dist;
                docker rm billing-extract;
                npx --yes @sentry/cli@2 sourcemaps upload --release="$SENTRY_RELEASE" --org="$SENTRY_ORG" --project="$SENTRY_PROJECT" ./dist;
              else
                echo "SENTRY_AUTH_TOKEN not set — skipping sourcemap upload";
              fi

            - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            - docker save $IMAGE:$TAG -o billing.tar
            - trivy image --input billing.tar --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --no-progress
            - rm -f billing.tar

            - docker push $IMAGE:$TAG
            - docker push $IMAGE:latest

      # NOTE: prod ECS cluster/service doesn't exist yet — this step will fail
      # until billing prod Terraform is applied.
      - step:
          name: Deploy to Production ECS
          trigger: manual
          script:
            - pip install awscli
            - aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
            - aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
            - aws configure set default.region "us-east-1"
            - aws ecs update-service --cluster billing-service-prod --service billing-service-prod-svc --force-new-deployment --region us-east-1
